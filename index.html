<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="An interactive A/B testing conflict decision tree."
    >

    <title>A/B Test Conflict Decision Tree</title>

    <link
        rel="stylesheet"
        href="static/css/style.css"
    >
</head>

<body>
    <main class="app-page">

        <header class="app-header">
            <p class="eyebrow">Interactive experimentation framework</p>

            <h1>A/B Test Conflict Decision Tree</h1>

            <p class="app-description">
                Follow the branches to evaluate an experiment where the
                primary metric improves but conversion rate declines.
            </p>

            <button
                type="button"
                id="restartTree"
                class="restart-button"
                hidden
            >
                Restart tree
            </button>
        </header>

        <section
            id="tree"
            class="decision-tree"
            aria-label="Interactive A/B test decision tree"
            aria-live="polite"
        >
            <p class="loading-message">
                Loading decision tree...
            </p>
        </section>

        <noscript>
            <p class="error-message">
                JavaScript must be enabled to use the interactive tree.
            </p>
        </noscript>

    </main>

    <script
        src="static/js/tree.js"
        defer
    ></script>
</body>
</html>
