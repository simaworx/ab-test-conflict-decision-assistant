<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A/B Test Conflict Decision Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="app-shell landing-page">
        <section class="landing-content">
            <p class="eyebrow">
                Product experimentation framework
            </p>

            <h1>A/B Test Conflict Decision Assistant</h1>

            <p class="landing-description">
                Work through a guided decision tree for experiments
                where the primary metric improves but conversion rate declines.
            </p>

            <a href="{{ url_for('start') }}" class="primary-button">
                Start evaluation
                <span aria-hidden="true">→</span>
            </a>
        </section>

        <figure class="reference-tree">
            <img
                src="{{ url_for('static', filename='images/decision-tree.png') }}"
                alt="Original A/B test conflict decision tree"
            >

            <figcaption>
                The interactive assistant is based on this decision framework.
            </figcaption>
        </figure>
    </main>
</body>
</html>
