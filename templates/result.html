<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ result.title }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="tree-page result-layout">

        <aside class="decision-path">
            <p class="eyebrow">Completed path</p>

            <div class="path-tree">
                {% for step in path %}
                    <div class="path-node completed">
                        <span class="path-dot"></span>

                        <div>
                            <p>{{ step.question }}</p>
                            <strong>{{ step.answer }}</strong>
                        </div>
                    </div>
                {% endfor %}

                <div class="path-node result">
                    <span class="path-dot"></span>

                    <div>
                        <p>Recommendation reached</p>
                    </div>
                </div>
            </div>
        </aside>

        <section class="result-panel">
            <p class="eyebrow">Recommended decision</p>

            <span class="result-status {{ result.status }}">
                {{ result.status }}
            </span>

            <h1>{{ result.title }}</h1>

            <p class="result-explanation">
                {{ result.explanation }}
            </p>

            <div class="result-actions">
                <a href="{{ url_for('restart') }}" class="primary-button">
                    Start again
                    <span aria-hidden="true">↻</span>
                </a>

                <a href="{{ url_for('index') }}" class="secondary-button">
                    Return to overview
                </a>
            </div>
        </section>

    </main>
</body>
</html>
